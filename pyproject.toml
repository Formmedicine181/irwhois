[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irwhois"
dynamic = ["version"]
description = "Check .ir domain availability via whois.nic.ir — CLI, interactive and web UI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "omidsp79", email = "cashomid@gmail.com" }]
keywords = ["whois", "ir", "domain", "irnic", "nic.ir", "availability"]
urls = { Homepage = "https://github.com/Omidsp79/nic-extract", Repository = "https://github.com/Omidsp79/nic-extract" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Name Service (DNS)",
]

[project.scripts]
irwhois = "irwhois.cli:main"

[tool.setuptools.dynamic]
version = { attr = "irwhois.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["irwhois*"]

[tool.setuptools.package-data]
irwhois = ["web/*"]
