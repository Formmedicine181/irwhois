# Publish the npm wrapper to GitHub Packages (shows up in the repo's
# "Packages" section). GitHub Packages only accepts scoped names, so the
# package is renamed to @omidsp79/irwhois at publish time; the npmjs.org
# variant stays unscoped (`irwhois`).
#
# Triggers: push a tag like `npm-v1.0.1`, or run manually from the Actions tab.
# No secrets needed: uses the automatic GITHUB_TOKEN (packages: write).
name: Publish npm (GitHub Packages)

on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Scope package name for GitHub Packages
        run: npm pkg set name="@omidsp79/irwhois"

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
