# Smoke-test the zero-dependency npm wrapper (npm/bin/irwhois.js) across
# Node versions. The wrapper bundles the Python sources, so no `npm ci`
# is needed — but the payload must be staged first via scripts/prepare.js
# (system python3 on the runner executes the bundled code).

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    defaults:
      run:
        working-directory: npm

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Stage bundled Python payload
      run: node scripts/prepare.js
    - name: Smoke-test wrapper
      run: |
        node bin/irwhois.js --version
        node bin/irwhois.js fa.ir --no-color
