# Attach built distributions (sdist + wheel) to a GitHub Release.
# Trigger: push a tag like `v1.0.2` (this also triggers the Docker workflow).
# No secrets needed: uses the automatic GITHUB_TOKEN (contents: write).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
